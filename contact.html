<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Thomas Carla Immigration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===== SIMPLE HEADER (No Navigation) ===== -->
    <header class="page-header-simple">
        <div class="container">
            <div class="simple-logo">
                <span class="logo-main">Thomas Carla</span>
                <span class="logo-sub">Immigration</span>
            </div>
        </div>
    </header>

    <!-- ===== CONTACT SECTION ===== -->
    <section class="contact-page">
        <div class="container">
            <div class="contact-wrapper">

                <h1>Get In Touch</h1>
                <p class="contact-subtitle">We're here to help with your immigration questions.</p>

                <!-- ===== CONTACT INFO ===== -->
                <div class="contact-info-grid">
                    <div class="contact-info-item">
                        <div class="contact-icon">📧</div>
                        <h3>Email</h3>
                        <a href="mailto:thomaschaseimmigration9@gmail.com">thomaschaseimmigration9@gmail.com</a>
                    </div>
                    <div class="contact-info-item">
                        <div class="contact-icon">💬</div>
                        <h3>Working Hours</h3>
                        <p>Monday - Friday: 9:00 AM - 6:00 PM</p>
                    </div>
                </div>

                <!-- ===== CONTACT FORM ===== -->
                <div class="contact-form-wrapper">
                    <h2>Send Us a Message</h2>
                    <form id="contact-form">

                        <div class="form-group">
                            <label for="contact-name">Your Name <span class="required">*</span></label>
                            <input type="text" id="contact-name" name="name" placeholder="e.g. John Doe" required />
                        </div>

                        <div class="form-group">
                            <label for="contact-email">Your Email <span class="required">*</span></label>
                            <input type="email" id="contact-email" name="email" placeholder="you@example.com" required />
                        </div>

                        <div class="form-group">
                            <label for="contact-message">Message <span class="required">*</span></label>
                            <textarea id="contact-message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-submit" id="contact-submit-btn">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>

                        <div id="contact-form-message" class="form-message" style="display: none;"></div>
                    </form>
                </div>

            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Thomas Carla Immigration Consultation. All consultations are confidential.</p>
        </div>
    </footer>

    <!-- ===== EMAILJS SDK ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
